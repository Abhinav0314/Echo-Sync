name: Validate Echo Sync
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: echo-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Protocol and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generate protocol
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash scripts/generate_proto.sh
      - name: Validate and build
        run: |
          gofmt -w internal/server
          echo "ECHO_FORMAT_PATCH:$(git diff --binary -- internal/server | base64 -w0)"
          go vet ./...
          go test -race -count=1 ./...
          go build ./cmd/metroserver
      - name: Verify deployment image
        run: |
          docker build -t echo-sync:test .
          docker run -d --name echo-sync-check -p 127.0.0.1:10000:10000 -e PORT=10000 -e DATABASE_FILE=/tmp/echo-sync.db -e SUPABASE_URL=https://test.invalid -e SUPABASE_ANON_KEY=public-test-key echo-sync:test
          trap 'docker logs echo-sync-check; docker rm -f echo-sync-check' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:10000/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:10000/ws)" = 401
